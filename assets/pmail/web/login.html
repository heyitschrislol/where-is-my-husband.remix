<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{{TITLE}}</title>
<style>
  :root { --bg:#f6f8fc; --card:#fff; --text:#202124; --muted:#5f6368; --line:#e0e3eb; --blue:#1a73e8; --shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15); }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }

  .topbar{ height:64px; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  .logo{ width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,#ea4335,#fbbc05,#34a853,#4285f4); }
  .brand{ font-weight:650; letter-spacing:.2px; }
  .search{ flex:1; max-width:760px; display:flex; align-items:center; gap:10px; padding:10px 14px; background:#eaf1fb; border-radius:24px; color:var(--muted); }
  .search input{ border:none; outline:none; background:transparent; width:100%; font-size:14px; }
  .wrap{ min-height:calc(100vh - 64px); display:flex; align-items:flex-start; justify-content:center; }

  .loginwrap{ width:min(420px, 92vw); margin:40px auto; }
  .logincard{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:22px; border:1px solid rgba(0,0,0,.03); }
  .logintitle{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .logintitle h1{ margin:0; font-size:20px; }
  label{ display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
  input{ width:100%; padding:12px; border-radius:12px; border:1px solid #dadce0; outline:none; font-size:14px; }
  input:focus{ border-color:#8ab4f8; box-shadow:0 0 0 4px rgba(26,115,232,.12); }
  .btn{ margin-top:14px; width:100%; padding:12px 14px; border:none; border-radius:12px; background:var(--blue); color:#fff; font-weight:650; cursor:pointer; }
  .btn:hover{ filter:brightness(.96); }
  .error{ background:#fce8e6; border:1px solid #fad2cf; color:#c5221f; border-radius:12px; padding:10px 12px; font-size:13px; margin-top:12px; }

  .overlay{ position:fixed; inset:0; background:rgba(255,255,255,.66); display:none; align-items:center; justify-content:center; }
  .overlay.show{ display:flex; }
  .spinner{ width:44px;height:44px;border-radius:50%; border:4px solid #d2e3fc; border-top-color:var(--blue); animation:spin .9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>

<body>
  <div class="topbar">
    <div class="logo" aria-hidden="true"></div>
    <div class="brand">{{BRAND}}</div>
    <div class="search">🔎 <input placeholder="Search mail" disabled /></div>
  </div>

  <div class="wrap">
    <div class="loginwrap">
      <div class="logincard">
        <div class="logintitle">
          <div class="logo"></div>
          <div>
            <h1>Sign in</h1>
            <div style="color:var(--muted); font-size:13px; margin-top:2px;">
              Continue to {{BRAND}} Mail
            </div>
          </div>
        </div>

        <form method="POST" action="/auth" id="loginForm">
          <label>Email</label>
          <input name="email" value="{{EMAIL}}" autocomplete="off" />

          <label>Password</label>
          <input type="password" name="password" autofocus />

          <button class="btn" type="submit">Next</button>

          {{ERROR_BLOCK}}
        </form>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="spinner" aria-label="Signing in"></div>
  </div>

  <script>
    const f = document.getElementById('loginForm');
    const o = document.getElementById('overlay');
    f.addEventListener('submit', () => { o.classList.add('show'); });
  </script>
</body>
</html>
