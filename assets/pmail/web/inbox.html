<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{{TITLE}}</title>
<style>
  :root { --bg:#f6f8fc; --card:#fff; --text:#202124; --muted:#5f6368; --line:#e0e3eb; --blue:#1a73e8; --chip:#e8f0fe; --shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15); }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }

  .topbar{ height:64px; display:flex; align-items:center; gap:14px; padding:0 16px; background:var(--bg); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .logo{ width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,#ea4335,#fbbc05,#34a853,#4285f4); }
  .brand{ font-weight:650; }
  .search{ flex:1; max-width:760px; display:flex; align-items:center; gap:10px; padding:10px 14px; background:#eaf1fb; border-radius:24px; color:var(--muted); }
  .search input{ border:none; outline:none; background:transparent; width:100%; font-size:14px; }
  .topright{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .acct{ text-align:right; line-height:1.1; }
  .acctname{ font-size:12px; color:var(--muted); }
  .acctemail{ font-size:13px; }
  .avatar{ width:34px;height:34px;border-radius:50%; background:#d7e3fc; display:flex; align-items:center; justify-content:center; font-weight:700; color:#174ea6; }

  .wrap{ display:flex; min-height:calc(100vh - 64px); }
  aside{ width:260px; padding:14px 10px; }
  .compose{ width:140px; padding:12px 14px; border-radius:16px; background:#c2e7ff; font-weight:650; margin:4px 10px 12px; text-align:center; opacity:.75; }
  .navitem{ display:flex; justify-content:space-between; padding:10px 12px; margin:2px 6px; border-radius:999px; font-size:14px; }
  .navitem.active{ background:var(--chip); color:#174ea6; font-weight:650; }
  main{ flex:1; padding:14px 18px; }
  .panel{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; border:1px solid rgba(0,0,0,.03); }

  .toolbar{ padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; color:var(--muted); font-size:13px; }
  .chip{ padding:6px 10px; border-radius:999px; background:#f1f3f4; font-size:12px; }
  .row{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid #f1f3f4; }
  .row:hover{ background:#f8fbff; }
  .row.unread{ background:#f2f6fc; font-weight:650; }
  .row a{ color:inherit; text-decoration:none; width:100%; display:flex; gap:12px; align-items:center; }
  .dot{ width:10px;height:10px;border-radius:50%; background:#1a73e8; opacity:0; }
  .row.unread .dot{ opacity:1; }
  .from{ width:210px; flex:0 0 210px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subj{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .snippet{ color:var(--muted); font-weight:450; }
  .date{ width:70px; flex:0 0 70px; text-align:right; color:var(--muted); font-size:13px; font-weight:500; }

  @media (max-width: 860px){ aside{ display:none; } main{ padding:12px; } .from{ width:140px; flex-basis:140px; } }
</style>
</head>

<body>
  <div class="topbar">
    <div class="logo"></div>
    <div class="brand">{{BRAND}}</div>
    <div class="search">🔎 <input placeholder="Search mail" disabled /></div>
    <div class="topright">
      <div class="acct">
        <div class="acctname">{{ACCOUNT_NAME}}</div>
        <div class="acctemail">{{EMAIL}}</div>
      </div>
      <div class="avatar">H</div>
    </div>
  </div>

  <div class="wrap">
    <aside>
      <div class="compose">Compose</div>
      <div class="navitem active">Inbox <span>{{UNREAD_BADGE}}</span></div>
      <div class="navitem">Starred</div>
      <div class="navitem">Snoozed</div>
      <div class="navitem">Sent</div>
      <div class="navitem">Drafts</div>
    </aside>

    <main>
      <div class="panel">
        <div class="toolbar">
          <div style="display:flex; gap:10px;">
            <span class="chip">Primary</span>
            <span class="chip">Social</span>
            <span class="chip">Promotions</span>
          </div>
          <div>Unread: <b>{{UNREAD_COUNT}}</b></div>
        </div>

        {{ROWS}}
      </div>
    </main>
  </div>
</body>
</html>
